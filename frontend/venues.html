<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SpotOn — Select Venue</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="neon-page">
  <header class="nav-header">
    <a href="main.html" class="logo-link"><h1 class="logo">🎟️ SpotOn</h1></a>
    <div>
      <button id="refreshBtn" class="btn-secondary">Refresh</button>
      <button id="logoutBtn" class="btn-secondary">Logout</button>
    </div>
  </header>
  <main class="container">
    <div id="venuesContainer" class="venue-grid"></div>
    <p id="venMsg" class="muted" style="text-align:center;margin-top:1rem;"></p>
  </main>

<script>

/* ---------- AUTO API DETECTION ---------- */
function getApiBase(){
  const origin = window.location.origin;
  if (origin.includes(".devtunnels.ms")) return origin + "/api";
  if (origin.includes("localhost") || origin.includes("127.0.0.1"))
    return "http://localhost:5507/api";
  return origin + "/api";
  /* Neon edge glow */
}
const API_BASE = getApiBase();

/* ---------- AUTH CHECK ---------- */
const token = localStorage.getItem("token");
if (!token) location.href = "login.html";

/* ---------- MOVIE CHECK (NEW & IMPORTANT) ---------- */
const selectedMovie = localStorage.getItem("selectedMovie");
if (!selectedMovie) {
  location.href = "movies.html";
}

/* ---------- UI refs ---------- */
const container = document.getElementById("venuesContainer");
const venMsg = document.getElementById("venMsg");
const refreshBtn = document.getElementById("refreshBtn");
const logoutBtn = document.getElementById("logoutBtn");

/* ---------- Fetch venues ---------- */
async function loadVenues(){
  container.innerHTML = "";
  venMsg.textContent = "Loading venues...";

  try {
    const res = await fetch(`${API_BASE}/theatres`, {
      headers: { Authorization: `Bearer ${token}` }
    });

    let data = null;
    if (res.ok) {
      try { data = await res.json(); } catch {}
    }

    const venues = Array.isArray(data) && data.length ? data : [
      {
        name: "PVR Cinemas",
        location: "Chennai",
        image: "PVR.jpg"
    
      },
      {
        name: "INOX City Center",
        location: "Coimbatore",
        image: "INOX.jpeg"
      },
      {
        name: "Sathyam Cinemas",
        location: "Madurai",
        image: "SATHYAM.png"
      },
      {
        name: "Luxe IMAX",
        location: "Bangalore",
        image: "IMAX.jpeg"
      }
    ];

    venues.forEach(v => {
      const card = document.createElement("div");
      card.className = "venue-card card";
      card.innerHTML = `
        <div class="venue-img-wrap">
          <img src="${v.image}" alt="${v.name}" class="venue-img"
               onerror="this.src='assets/default-venue.png'" />

          <span class="venue-badge">Now Showing</span>
          <span class="venue-rating">⭐ 4.5</span>
          <span class="venue-location">📍 ${v.location}</span>
        </div>

        <div class="venue-content">
          <h3>${v.name}</h3>
          <p>Premium experience</p>

          <div class="venue-actions">
            <button class="btn ghost" data-preview>Preview</button>
            <button class="btn-primary" data-name="${v.name}">Book</button>
          </div>
        </div>
      `;
      container.appendChild(card);
    });

    venMsg.textContent = "";
  } catch (err) {
    venMsg.textContent = "Failed to load venues.";
    console.error(err);
  }
}

/* ---------- Click handlers ---------- */
document.addEventListener("click", (e)=>{
  if (e.target.matches(".btn-primary")) {
    const card = e.target.closest(".venue-card");

    const selectedVenue = {
      name: e.target.dataset.name,
      location: card.querySelector("p").textContent,
      image: card.querySelector(".venue-img").src
    };

    localStorage.setItem("selectedVenue", JSON.stringify(selectedVenue));

    // clear downstream selections only
    localStorage.removeItem("selectedScreen");
    localStorage.removeItem("selectedDate");
    localStorage.removeItem("selectedTime");

    location.href = "screens.html";
  }

  if (e.target.matches("button[data-preview]")) {
    alert("VR preview coming soon");
  }
});

/* ---------- misc ---------- */
refreshBtn.addEventListener("click", loadVenues);

logoutBtn.addEventListener("click", ()=>{
  localStorage.clear();
  location.href = "login.html";
});

/* ---------- init ---------- */
loadVenues();
</script>
</body>
</html>
