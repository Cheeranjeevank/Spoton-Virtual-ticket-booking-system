<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Your Ticket • SpotOn</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<main class="container" style="text-align:center">
  <h2>Your Ticket</h2>
  <div id="ticketBox"></div>
  <a id="dashboardBtn" class="btn-primary" href="dashboard.html" style="display:inline-block;margin-top:1rem">Go to Dashboard</a>
</main>

<script>
function getApiBase(){ 
  const origin = window.location.origin;
  if (origin.includes(".devtunnels.ms")) return origin.replace("/frontend","") + "/api";
  if (origin.includes("localhost")) return "http://localhost:5503/api";
  return origin + "/api";
}

const API_BASE = getApiBase();
const ticketBox = document.getElementById("ticketBox");

// load booking array from summary confirmation
const bookingArr = JSON.parse(localStorage.getItem("lastBooking") || "[]");

if (!Array.isArray(bookingArr) || bookingArr.length === 0) {
  ticketBox.innerHTML = "<p class='muted'>No booking found.</p>";
} else {
  const first = bookingArr[0];

  // extract show details
  const showParts = first.show.split(" - ");
  const venue = showParts[0] || "";
  const screen = showParts[1] || "";
  const time = showParts[2] || "";
  const date = showParts[3] || "";

  // build seat list
  const seatList = bookingArr.map(b => b.seat).join(", ");

  // fetch QR code
  fetch(`${API_BASE}/ticket/${first._id}`, {
    headers: { "Authorization": "Bearer " + localStorage.getItem("token") }
  })
  .then(r => r.json())
  .then(data => {
    const qr = data.qr || "";

    ticketBox.innerHTML = `
      <div class="ticket-card" style="background:var(--panel);padding:1rem;border-radius:12px;max-width:420px;margin:0 auto;box-shadow:0 6px 18px rgba(0,0,0,.35)">
        <h3 style="margin-bottom:.5rem">${venue}</h3>
        <p><strong>${screen}</strong></p>
        <p>${date} • ${time}</p>
        <hr style="opacity:.2;margin:1rem 0"/>
        <p><strong>Seats:</strong> ${seatList}</p>
        <img src="${qr}" alt="QR Code" style="max-width:220px;margin:1rem auto;display:block"/>
        <p style="font-size:.85rem;color:var(--muted)">Booking ID: ${first._id}</p>
      </div>
    `;
  })
  .catch(() => {
    ticketBox.innerHTML = "<p class='muted'>Failed to load ticket.</p>";
  });
}
</script>
<script src="script.js"></script>
</body>
</html>
